version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: careersync-postgres
    restart: always
    environment:
      POSTGRES_USER: careersync
      POSTGRES_PASSWORD: careersync_dev_password
      POSTGRES_DB: careersync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careersync -d careersync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
